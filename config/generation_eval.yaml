# Generation + detection + judge + evaluation on real data (generation_eval category).
model: qwen3_5_4b
dataset: triviaqa
num_samples: 16
backend: vllm

sampling:
  k: 5
  temperature: 1.0
  top_p: 0.95
  top_k: 10
  max_new_tokens: 24
  seed: 42

methods:
  - reppl-a
  - reppl-b
  - outer-perplexity
  - lnpe
  - eigenscore-last
  - semantic-entropy-lexical
  - length
