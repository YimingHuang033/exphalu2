# RePPL 2.0 base configuration. All paths / parameters / key env-var names live here.
# Sub-configs (smoke/generation_eval/perf/interp) inherit this file via _include_base_.

model: qwen3_5_4b          # model registry key below
backend: vllm              # vllm | transformers (legacy port) | sglang (blocked)
backend_cfg:
  gpu_memory_utilization: 0.85
  max_model_len: 4096
  enforce_eager: true
  dtype: bfloat16
  seed: 42

models:
  qwen3_5_4b:
    path: /home/tim/Proj/resource/Qwen3.5-4B
    note: primary validation model; /mnt/data copy is on a disk with bad sectors
  qwen2_5_0_5b:
    path: /mnt/data/Qwen2.5-0.5B-Instruct
  qwen2_5_1_5b:
    path: /mnt/data/Qwen2.5-1.5B-Instruct
  qwen3_4b:
    path: /mnt/data/Qwen3-4B
    note: BLOCKED on this machine - shard 1 has unreadable sectors (I/O error / SIGBUS)
  deberta-mnli:
    path: /mnt/data/deberta-v2-xlarge-mnli
    note: NLI entailment for original semantic entropy; readability self-checked at load

datasets:
  triviaqa:
    status: implemented
    path: /mnt/data/trivia_qa/rc.nocontext/validation-00000-of-00001.parquet
    system_prompt: You are a helpful AI assistant. Answer the user's question concisely. Avoid full sentences.
  synthetic:
    status: implemented
  squad:
    status: blocked:raw-json-not-mounted
    raw_json: ""            # fill local dev-v2.0.json path to enable the implemented adapter
  coqa:
    status: blocked:raw-json-not-mounted
    raw_json: ""
  nq:
    status: blocked:no-local-file

num_samples: 8
dataset: synthetic

sampling:
  k: 5                       # number of sampled outputs per question
  temperature: 1.0
  top_p: 0.95
  top_k: 10
  max_new_tokens: 32
  seed: 42

aggregator:                  # DESIGN.md section 3.2, versioned
  tau: 0.01
  alpha: 2.0
  epsilon: 0.001
  version: agg-v1-ddof0

association_temperature: 1.0
methods:
  - reppl-a
  - outer-perplexity
  - lnpe
  - eigenscore-last
  - semantic-entropy-lexical
  - length

reppl_b:
  max_units: 4               # J budget for intervention replays (K*(1+J) replays)

judge:
  prompt_version: judge-yesno-v1

# Judge provider registry (DESIGN.md section 7.5). Local judge is the implemented path;
# remote providers are registered but blocked without keys/services.
judge_providers:
  local_self:
    adapter: local           # same model as target; implemented
    status: implemented
  api_llm:
    adapter: llm_api
    protocol: openai_chat_compatible
    base_url_env: API_LLM_BASE_URL
    api_key_env: API_LLM_KEY
    model_env: API_LLM_MODEL
    status: blocked:no-key
  jev_api:
    adapter: systemone
    base_url_env: JEV_BASE_URL
    api_key_env: JEV_API_KEY
    model_env: JEV_MODEL
    status: blocked:no-key
  startlux_local:
    adapter: systemone
    base_url: http://127.0.0.1:8090
    model: startlux-models/StartLux-Decision-4B
    status: blocked:service-not-deployed
  open20b_local:
    adapter: llm_api
    protocol: openai_chat_compatible
    base_url: http://127.0.0.1:8000/v1
    model_env: LOCAL_20B_MODEL
    status: blocked:service-not-deployed

interp:
  save_intermediates: true
