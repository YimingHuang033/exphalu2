  mmlu_pro:
    status: implemented
    path: /mnt/data/datasets/MMLU_Pro_full.json
    system_prompt: >-
      You are a helpful AI assistant. Answer the multiple-choice question.
      Think briefly if needed, then state your final choice as the last line in
      the form: Final answer: <letter>
    sampling:               # up to 10 options, reasoning-heavy
