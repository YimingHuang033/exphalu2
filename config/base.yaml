# RePPL 2.0 base configuration. All paths / parameters / key env-var names live here.
# Sub-configs (smoke/generation_eval/perf/interp) inherit this file via _include_base_.

model: qwen3_5_4b          # model registry key below
backend: vllm              # vllm | transformers (legacy port) | sglang (blocked)
backend_cfg:
  gpu_memory_utilization: 0.85
  max_model_len: 4096
  enforce_eager: true
  dtype: bfloat16
  seed: 42
  env:                        # engine env-var knobs, applied by the backend before loading vLLM
    # No CUDA toolkit/nvcc on this machine: flashinfer JIT sampler crashes the engine
    # core mid-sampling (RuntimeError: Could not find nvcc). 0 = native torch sampler.
    VLLM_USE_FLASHINFER_SAMPLER: "0"

models:
  qwen3_5_4b:
    path: /home/tim/Proj/resource/Qwen3.5-4B
    note: primary validation model; /mnt/data copy is on a disk with bad sectors
  qwen2_5_0_5b:
    path: /mnt/data/Qwen2.5-0.5B-Instruct
  qwen2_5_1_5b:
    path: /mnt/data/Qwen2.5-1.5B-Instruct
  qwen2_5_7b:
    path: /mnt/data/Qwen2.5-7B-Instruct
    note: shard readability spot-checked 2026-10-06 (multi-offset dd)
  qwen3_1_7b:
    path: /mnt/data/Qwen3-1.7B
    note: shards fully re-read 2026-10-06, no I/O error
  qwen3_4b:
    path: /mnt/data/Qwen3-4B
    note: BLOCKED on this machine - shard 1 re-confirmed unreadable 2026-10-06 (I/O error)
  qwen3_8b:
    path: /mnt/data/Qwen3-8B
    note: shard readability spot-checked 2026-10-06 (multi-offset dd)
  gpt-oss-20b:
    path: /mnt/data/gpt-oss-20b
    note: external judge model (mxfp4 MoE); shards fully re-read 2026-10-06, no I/O error
  startlux-decision-27b:
    path: /mnt/data/StartLux-Decision-27B-Q8_0-GGUF
    note: judge decision model (Qwen3.5-27B base), Q8_0 GGUF; served by llama.cpp + the
          official startlux_decision package (/v1/systemone) - NOT a vLLM model;
          judge tasks run as one forward pass with option-letter readout, no generation
  deberta-mnli:
    path: /mnt/data/deberta-v2-xlarge-mnli
    note: NLI entailment for original semantic entropy; readability self-checked at load
  sent-emb-static-mrl:
    path: /home/tim/Proj/resource/sent-emb-static-similarity-mrl
    note: SeSE sentence embedder (official model tomaarsen/static-similarity-mrl-multilingual-v1,
          downloaded via hf-mirror.com; huggingface.co unreachable on this network)

datasets:
  triviaqa:
    status: implemented
    path: /mnt/data/trivia_qa/rc.nocontext/validation-00000-of-00001.parquet
    system_prompt: You are a helpful AI assistant. Answer the user's question concisely. Avoid full sentences.
  synthetic:
    status: implemented
  gsm8k:
    status: implemented
    path: /mnt/data/gsm8k/main/test-00000-of-00001.parquet
    system_prompt: >-
      You are a helpful AI assistant. Solve the math problem step by step,
      keeping it brief. End your reply with the final numeric answer on its own
      last line in the form: Final answer: <number>
    sampling:               # math needs room for a short chain of thought
      max_new_tokens: 192
  math500:
    status: implemented
    path: /mnt/data/MATH-500/test.jsonl
    system_prompt: >-
      You are a helpful AI assistant. Solve the math problem step by step,
      keeping it brief. End your reply with the final answer on its own last
      line in the form: Final answer: <answer>
    sampling:
      max_new_tokens: 192
  competition_math:
    status: implemented
    path: /mnt/data/datasets/competition_math_level_balanced_200.json
    system_prompt: >-
      You are a helpful AI assistant. Solve the math problem step by step,
      keeping it brief. End your reply with the final numeric answer on its own
      last line in the form: Final answer: <number>
    sampling:
      max_new_tokens: 192
  competition_math_level5:
    status: implemented
    path: /mnt/data/datasets/competition_math_level_Level 5_200.json
    system_prompt: >-
      You are a helpful AI assistant. Solve the math problem step by step,
      keeping it brief. End your reply with the final numeric answer on its own
