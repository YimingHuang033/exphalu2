  hle_text:
    status: implemented
    path: /mnt/data/datasets/hle.json
    system_prompt: >-
      You are a helpful AI assistant. Answer the question concisely. State only
      the short final answer.
    sampling:
      max_new_tokens: 64
  gpqa_diamond:
    status: implemented
    path: /mnt/data/datasets/GPQA-Diamond.json
    system_prompt: >-
      You are a helpful AI assistant. Answer the multiple-choice question.
      Think briefly if needed, then state your final choice as the last line in
      the form: Final answer: <letter>
    sampling:
      max_new_tokens: 192
  mmlu_college_chemistry:
    status: implemented
    path: /mnt/data/datasets/MMLU_College_Chemistry_full.json
    system_prompt: >-
      You are a helpful AI assistant. Answer the multiple-choice question.
      Reply with the correct option letter only.
    sampling:
      max_new_tokens: 48
  mmlu_college_computer_science:
    status: implemented
    path: /mnt/data/datasets/MMLU_College_Computer_Science_full.json
    system_prompt: >-
      You are a helpful AI assistant. Answer the multiple-choice question.
      Reply with the correct option letter only.
    sampling:
      max_new_tokens: 48
  mmlu_college_mathematics:
    status: implemented
    path: /mnt/data/datasets/MMLU_College_Math_full.json
    system_prompt: >-
      You are a helpful AI assistant. Answer the multiple-choice question.
      Reply with the correct option letter only.
    sampling:
      max_new_tokens: 48
  squad:
    status: blocked:raw-json-not-mounted
    raw_json: ""            # fill local dev-v2.0.json path to enable the implemented adapter
  coqa:
    status: blocked:raw-json-not-mounted
    raw_json: ""
  nq:
    status: blocked:no-local-file
  hle:
    status: blocked:multimodal-items
    note: full hle.json includes image items; use the text-only exactMatch subset
          via the implemented hle_text adapter instead
  livebench:
    status: blocked:not-factual-qa
    note: coding-only instruction set; no ground-truth short answers for hallucination labeling

num_samples: 8
dataset: synthetic

sampling:
  k: 5                       # number of sampled outputs per question
  temperature: 1.0
  top_p: 0.95
  top_k: 10
  max_new_tokens: 32
  seed: 42

aggregator:                  # DESIGN.md section 3.2, versioned
  tau: 0.01
  alpha: 2.0
  epsilon: 0.001
  version: agg-v1-ddof0

association_temperature: 1.0
methods:
  - reppl-a
  - outer-perplexity
  - lnpe
  - eigenscore-last
  - semantic-entropy-lexical
  - length

reppl_b:
  max_units: 4               # J budget for intervention replays (K*(1+J) replays)

sese:                        # SeSE (official port; GPT-4o answer enhancement skipped - no key)
  tree_depth: 2
  w_entail: 0.65
  similarity_threshold: 0.3
  nli_dtype: float16         # deberta-xlarge must share the GPU with the vLLM runner
  nli_device: cuda:0
  emb_device: cpu            # static embeddings are cheap; keep GPU for the engine

d_score:
  tau: 10.0                  # singular-value relative tolerance (sigma_1/sigma_i <= tau)

rauq:                        # official defaults (rauq.py); transformers reference env only
  alpha: 0.2
  head: max                  # dynamic per-sequence head selection
  token_aggregation: meanmin
  aggregation: mean
  # layers: null             # default = middle third (range(n//3, ceil(2n/3)+1))

reppl_ab:
  nominate_by: r             # A-side criterion for top-J nomination: r (instability) | mu

judge:
  prompt_version: judge-yesno-v2   # v2: reference (ground-truth) aware
  provider: local_self             # selected judge provider (see judge_providers)
  reasoning_effort: low            # gpt-oss judge only
  max_chars:                       # guard the 4096 judge window against long inputs
    context: 4000
    answer: 1500
    gold: 800

# Judge provider registry (DESIGN.md section 7.5). Local judges are the implemented
# path; remote providers are registered but blocked without keys/services.
judge_providers:
  local_self:
    adapter: local        # same model as target; implemented
    status: implemented
  gpt_oss_20b:
    adapter: local        # separate local judge model, time-shared on the GPU
    model: gpt-oss-20b    # key into models registry
    reasoning: final      # prompt directly into the final channel (Yes/No + label likelihood)
    status: implemented
    backend_cfg:          # overrides backend_cfg for the judge engine only
      gpu_memory_utilization: 0.80
      max_model_len: 4096
      enforce_eager: true
      dtype: bfloat16
      seed: 42
  api_llm:
    adapter: llm_api
    protocol: openai_chat_compatible
    base_url_env: API_LLM_BASE_URL
    api_key_env: API_LLM_KEY
    model_env: API_LLM_MODEL
    status: blocked:no-key
  jev_api:
    adapter: systemone
    base_url_env: JEV_BASE_URL
    api_key_env: JEV_API_KEY
    model_env: JEV_MODEL
    status: blocked:no-key
  startlux_local:
    adapter: systemone
    base_url: http://127.0.0.1:8090
    model: startlux-decision-27b   # provenance key into models registry
    correct_option: correct
    hallucinated_option: hallucinated
    status: blocked:llama.cpp-binary-download-unreachable
    note: adapter (reppl2/judges/systemone.py) + service script implemented and unit-tested;
          blocked because llama.cpp CUDA binaries cannot be downloaded (github release CDN
          unreachable, mirrors stall). Resume via scripts/setup/startlux_service.sh once
          llama-server is in place; set status back to implemented after verify-judge passes.
    service:                       # managed by scripts/setup/startlux_service.sh
      model_dir: /mnt/data/StartLux-Decision-27B-Q8_0-GGUF
      llama_binary: /home/tim/Proj/resource/llama.cpp/llama-server
      llama_port: 8081
      port: 8090
      ctx: 16384
      parallel: 4
      wait_ready_s: 600
  open20b_local:
    adapter: llm_api
    protocol: openai_chat_compatible
    base_url: http://127.0.0.1:8000/v1
    model_env: LOCAL_20B_MODEL
    status: blocked:service-not-deployed

interp:
  save_intermediates: true
