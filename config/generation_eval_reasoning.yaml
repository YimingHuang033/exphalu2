# Generation + detection + judge + evaluation with a REASONING (thinking) target
# model on the DESIGN 9.4 short-context datasets. Qwen3.x thinking mode is enabled
# at the chat template; budgets must cover think + answer (DESIGN 9.5.4), and
# truncated thinks are excluded honestly (never scored as natural hallucination).
model: qwen3_5_4b
chat_template_kwargs:
  enable_thinking: true
num_samples: 2000
backend: vllm

judge:
  provider: gpt_oss_20b   # external judge (gpt-oss-20b), reference-aware prompt v2,
                          # sees the post-think answer only

sampling:
  k: 5
  temperature: 1.0
  top_p: 0.95
  top_k: 10
  max_new_tokens: 1024    # thinking-mode default budget (think + answer)
  seed: 42

datasets:
  supergpqa:              # graduate-level MCQ: leave room for a full reasoning trace
    sampling:
      max_new_tokens: 1536
  popqa:                  # short factual QA: shorter think trace expected
    sampling:
      max_new_tokens: 1024

methods:
  - reppl-a
  - reppl-b
  - outer-perplexity
  - lnpe
  - eigenscore-last
  - semantic-entropy-lexical
  - length
  - d-score-last
  - sese
  - semantic-energy
  - reppl-b-rawq
  - reppl-ab
